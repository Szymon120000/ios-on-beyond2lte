name: b2l-xnu

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (the ios-sweet provider patches use SWEET)
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      b2l_board:
        description: Select the Exynos 9820 board layer
        default: "1"
  push:
    branches: [main]
    paths:
      - "board/b2l/**"
      - "xnu/patches/**"
      - "tools/b2l/**"
      - ".github/workflows/b2l.yml"

concurrency:
  group: b2l-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: "13.5"
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  B2L_BOARD: ${{ inputs.b2l_board || '1' }}

jobs:
  contract:
    name: Board contract and patch order
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check patch order
        run: python3 tools/b2l/check-patch-order.py
      - name: Generate and validate the Apple device tree
        run: |
          python3 tools/b2l/mkadt.py --check
          mkdir -p out
          python3 tools/b2l/mkadt.py out/b2l.adt
          python3 tools/b2l/mkadt.py out/b2l.adt --dump > out/b2l-adt.txt
      - uses: actions/upload-artifact@v4
        with:
          name: b2l-adt
          path: out/b2l.adt
          if-no-files-found: error

  kernel:
    name: Build XNU 8796 with B2L board layer
    needs: contract
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch darwin-xnu-build and stage both patch series
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          cp board/b2l/patches/*.patch dxb/patches/
          # libfirehose_kernel is built arm64e-only; this kernel is plain arm64.
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches | tail -5

      - name: Toolchain
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee ../b2l-build.log

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          cp b2l-build.log out/ 2>/dev/null || true
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2l-kernel
          path: out/
          if-no-files-found: warn
